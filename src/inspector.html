<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visual Inspector</title>
  <style>
    :root {
      --bg-surface: #1e1e2e;
      --bg-panel: #252538;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #8b5cf6;
      --accent-hover: #7c3aed;
      --border-default: rgba(148, 163, 184, 0.2);
      --border-focus: rgba(139, 92, 246, 0.5);
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      font-family: var(--font-sans);
      background: var(--bg-surface);
      color: var(--text-primary);
      overflow: hidden;
    }
    .sidebar {
      width: 340px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-default);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 15px rgba(0,0,0,0.1);
      z-index: 20;
    }
    .header {
      padding: 20px;
      border-bottom: 1px solid var(--border-default);
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
    }
    .content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      color: var(--text-primary);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }
    .form-input::placeholder {
      color: #64748b;
    }
    .form-input[readonly] {
      background: rgba(30, 30, 46, 0.5);
      color: #cbd5e1;
      cursor: default;
    }
    
    #selector-choices-wrapper {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-default);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #selector-choices-dropdown {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      padding: 8px 10px;
      background: rgba(30, 30, 46, 0.8);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(139, 92, 246, 0.3), 0 2px 4px -1px rgba(139, 92, 246, 0.2);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 8px -1px rgba(139, 92, 246, 0.4), 0 4px 6px -1px rgba(139, 92, 246, 0.3);
    }
    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 4px -1px rgba(139, 92, 246, 0.3);
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: auto;
    }
    webview {
      border: none;
      width: 100%;
      height: 100%;
      background: white;
      flex: 1;
    }
    #loading {
      position: absolute;
      inset: 0;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .hidden {
      display: none !important;
    }
    input:checked ~ .toggle-track {
      background-color: #3b82f6; /* blue-500 */
      border-color: #2563eb;
    }
    input:checked ~ .toggle-dot {
      transform: translateX(16px);
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <span style="font-size: 1.4rem;">🎭</span> Add Test Step
    </div>
    <div class="content">
      <div class="form-group">
        <label class="form-label">Step Type</label>
        <select id="step-type" class="form-select">
          <optgroup label="Navigation">
            <option value="navigate">🌐 Navigate to URL</option>
          </optgroup>
          <optgroup label="Actions">
            <option value="click">👆 Click</option>
            <option value="dblclick">👆👆 Double Click</option>
            <option value="fill">✏️ Fill / Type</option>
            <option value="select">📋 Select Option</option>
            <option value="check">☑️ Check</option>
            <option value="uncheck">⬜ Uncheck</option>
            <option value="upload">📁 Upload File</option>
            <option value="hover">🖱️ Hover</option>
            <option value="press">⌨️ Press Key</option>
            <option value="scrollTo">📜 Scroll To</option>
          </optgroup>
          <optgroup label="Assertions">
            <option value="assertVisible">👁️ Assert Visible</option>
            <option value="assertText">📝 Assert Text</option>
            <option value="assertValue">🔢 Assert Value</option>
            <option value="assertUrl">🔗 Assert URL</option>
          </optgroup>
          <optgroup label="Utilities">
            <option value="waitForSelector">⏳ Wait for Element</option>
            <option value="waitForTimeout">⏱️ Wait (Time)</option>
            <option value="screenshot">📸 Take Screenshot</option>
          </optgroup>
        </select>
      </div>
      <div class="form-group" id="selector-group">
        <label class="form-label">Selector</label>
        <input type="text" id="step-selector" class="form-input" placeholder="Select an element..." readonly>
        <div id="selector-choices-wrapper" class="hidden">
          <label for="selector-choices-dropdown" class="form-label" style="font-size: 0.75rem; margin-bottom: 4px;">Alternative Selectors:</label>
          <select id="selector-choices-dropdown" class="form-select"></select>
        </div>
      </div>
      <div class="form-group" id="value-group">
        <label class="form-label">Value</label>
        <input type="text" id="step-value" class="form-input" placeholder="Value to input or assert">
        <datalist id="inspector-asset-files-list"></datalist>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <input type="text" id="step-description" class="form-input" placeholder="e.g. Click Login Button">
      </div>
      <div style="display: flex; gap: 10px; margin-bottom: 16px;">
        <button id="add-step-btn" class="btn" style="flex: 1;">Add Step to Test</button>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; background: rgba(30,30,46,0.5); padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-default);">
          <div style="position: relative; width: 36px; height: 20px;">
            <input type="checkbox" id="auto-record-toggle" style="opacity: 0; width: 0; height: 0; position: absolute;">
            <div class="toggle-track" style="position: absolute; inset: 0; background: var(--bg-surface); border-radius: 20px; border: 1px solid var(--border-default); transition: 0.2s;"></div>
            <div class="toggle-dot" style="position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-muted); transition: 0.2s;"></div>
          </div>
          <span style="font-size: 0.85rem; font-weight: 500;">Record</span>
          <span id="record-indicator" class="hidden" style="width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444;"></span>
        </label>
      </div>
      <div id="status-message" style="margin-top: 16px; font-size: 0.9rem; color: #10b981; display: none; text-align: center; font-weight: 500;">
        <span style="display:inline-block; margin-right:4px;">✓</span> Step added successfully!
      </div>
    </div>
  </div>
  <div class="main-area">
    <div id="headful-fallback-ui" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; background: var(--bg-surface);">
      <div class="browser-pulse" style="position: relative; width: 64px; height: 64px; margin-bottom: 24px;">
        <div style="position: absolute; inset: 0; border: 3px solid var(--accent-primary); border-radius: 50%; animation: pulse 2s infinite ease-in-out;"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px;">🌐</div>
      </div>
      <style>
        @keyframes pulse {
          0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
          70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(139, 92, 246, 0); }
          100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }
      </style>
      <h2 style="margin: 0 0 12px 0; font-size: 1.5rem; font-weight: 600;">Live Capture Active</h2>
      <p style="margin: 0; color: var(--text-muted); max-width: 400px; line-height: 1.5;">
        A separate browser window has been opened. Interact with that window, and your clicks and typing will automatically appear here.
      </p>
      
      <div id="connection-status" style="margin-top: 32px; padding: 12px 24px; background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></span>
        Connected to Browser
      </div>
    </div>
    <webview id="inspector-iframe" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" style="width: 100%; height: 100%; border: none; background: white;"></webview>
  </div>
  <script type="module" src="/src/inspector.js?v=2"></script>
</body>
</html>
